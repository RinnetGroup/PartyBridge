<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PartyBridge · Volume</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="volume-page">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h1 class="volume-title">PartyBridge volume</h1>
            <p class="muted">Adjust your current call. Keep your party tab open.</p>
          </div>
        </div>
        <div id="volume-controls"></div>
        <p class="tiny">100% is normal volume. 0% is silent. Above 100% boosts the audio.</p>
      </section>
    </main>
    <script type="module" src="/volume-controls.js"></script>
  </body>
</html>
